<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 240 240">
  <style>
    svg { background: #080a0d; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .game { animation: game-in 12s infinite; }
    .dial { transform-origin: 240px 240px; animation: dial-shrink 12s infinite; }
    .digit-1, .digit-2, .digit-3, .digit-4 { opacity: 0; }
    .digit-1 { animation: digit-1 12s infinite; }
    .digit-2 { animation: digit-2 12s infinite; }
    .digit-3 { animation: digit-3 12s infinite; }
    .digit-4 { animation: digit-4 12s infinite; }
    .press-9-a, .press-9-b, .press-9-c, .press-9-d,
    .press-6, .press-2-a, .press-2-b, .press-5 { opacity: 0; }
    .press-9-a { animation: press-a 12s infinite; }
    .press-9-b { animation: press-b 12s infinite; }
    .press-9-c { animation: press-c 12s infinite; }
    .press-9-d { animation: press-d 12s infinite; }
    .press-6 { animation: press-6 12s infinite; }
    .press-2-a { animation: press-2a 12s infinite; }
    .press-2-b { animation: press-2b 12s infinite; }
    .press-5 { animation: press-5 12s infinite; }
    .player { animation: drive 12s infinite; }
    .bullet { animation: shoot 12s infinite; }
    .enemy { animation: enemy 12s infinite; }
    .blast { transform-origin: 117px 62px; animation: blast 12s infinite; }
    .status { animation: status 12s infinite; }

    @keyframes game-in {
      0%, 31% { opacity: 0; }
      39%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes dial-shrink {
      0%, 30% { transform: translate(0,0) scale(1); }
      39%, 96% { transform: translate(6px,6px) scale(.46); }
      100% { transform: translate(0,0) scale(1); }
    }
    @keyframes digit-1 { 0%, 5% { opacity: 0; } 5.1%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes digit-2 { 0%, 10.5% { opacity: 0; } 10.6%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes digit-3 { 0%, 16% { opacity: 0; } 16.1%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes digit-4 { 0%, 21.5% { opacity: 0; } 21.6%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes press-a { 5%, 6.8% { opacity: .9; } 0%, 4.9%, 6.9%, 100% { opacity: 0; } }
    @keyframes press-b { 10.5%, 12.3% { opacity: .9; } 0%, 10.4%, 12.4%, 100% { opacity: 0; } }
    @keyframes press-c { 16%, 17.8% { opacity: .9; } 0%, 15.9%, 17.9%, 100% { opacity: 0; } }
    @keyframes press-d { 21.5%, 23.3% { opacity: .9; } 0%, 21.4%, 23.4%, 100% { opacity: 0; } }
    @keyframes press-2a { 40%, 42% { opacity: .9; } 0%, 39.9%, 42.1%, 100% { opacity: 0; } }
    @keyframes press-6 { 51%, 53% { opacity: .9; } 0%, 50.9%, 53.1%, 100% { opacity: 0; } }
    @keyframes press-2b { 57%, 59% { opacity: .9; } 0%, 56.9%, 59.1%, 100% { opacity: 0; } }
    @keyframes press-5 { 64%, 66% { opacity: .9; } 0%, 63.9%, 66.1%, 100% { opacity: 0; } }
    @keyframes drive {
      0%, 42% { transform: translate(45px,172px) rotate(0deg); }
      50% { transform: translate(45px,120px) rotate(0deg); }
      51% { transform: translate(45px,120px) rotate(90deg); }
      58% { transform: translate(117px,120px) rotate(90deg); }
      60%, 96% { transform: translate(117px,120px) rotate(0deg); }
      100% { transform: translate(45px,172px) rotate(0deg); }
    }
    @keyframes shoot {
      0%, 65% { opacity: 0; transform: translate(115px,100px); }
      66% { opacity: 1; transform: translate(115px,100px); }
      75% { opacity: 1; transform: translate(115px,71px); }
      76%, 100% { opacity: 0; transform: translate(115px,71px); }
    }
    @keyframes enemy { 0%, 75% { opacity: 1; } 76%, 91% { opacity: 0; } 92%, 100% { opacity: 1; } }
    @keyframes blast {
      0%, 74% { opacity: 0; transform: scale(.2); }
      76% { opacity: 1; transform: scale(.5); }
      81% { opacity: 1; transform: scale(1.2); }
      87%, 100% { opacity: 0; transform: scale(1.5); }
    }
    @keyframes status { 0%, 37% { opacity: 0; } 40%, 96% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <g class="game">
    <rect width="240" height="240" fill="#16191d"/>
    <rect x="4" y="4" width="232" height="232" rx="3" fill="#20242a" stroke="#454b53" stroke-width="2"/>
    <defs>
      <pattern id="brick" width="24" height="16" patternUnits="userSpaceOnUse">
        <rect width="24" height="16" fill="#9c3d22"/>
        <path d="M0 0h24M0 8h24M8 0v8M18 8v8" fill="none" stroke="#df7650" stroke-width="2"/>
        <path d="M1 3h6M10 11h7" stroke="#5d2318" stroke-width="2" opacity=".75"/>
      </pattern>
      <pattern id="water" width="18" height="12" patternUnits="userSpaceOnUse">
        <rect width="18" height="12" fill="#176694"/>
        <path d="M-3 4q4-4 8 0t8 0t8 0M-3 10q4-4 8 0t8 0t8 0" fill="none" stroke="#55b9e5" stroke-width="2"/>
      </pattern>
    </defs>
    <g fill="url(#brick)">
      <rect x="12" y="28" width="80" height="16"/>
      <rect x="12" y="44" width="16" height="108"/>
      <rect x="76" y="44" width="16" height="52"/>
      <rect x="64" y="80" width="40" height="16"/>
      <rect x="142" y="28" width="86" height="16"/>
      <rect x="142" y="44" width="16" height="48"/>
      <rect x="142" y="96" width="86" height="16"/>
      <rect x="212" y="112" width="16" height="42"/>
      <rect x="12" y="194" width="76" height="16"/>
      <rect x="12" y="210" width="16" height="18"/>
      <rect x="88" y="152" width="16" height="76"/>
      <rect x="132" y="174" width="48" height="16"/>
      <rect x="132" y="190" width="16" height="38"/>
      <rect x="180" y="210" width="48" height="18"/>
    </g>
    <g fill="url(#water)" opacity=".9">
      <path d="M40 52h28v44H40zm124 0h64v28h-64zM158 122h70v36h-70z"/>
    </g>
    <g fill="#477d30" stroke="#6da64a" stroke-width="2" opacity=".95">
      <path d="M106 164c8-12 25-9 27 4 12-8 25 4 18 15 8 8-2 20-13 15-7 9-23 3-21-8-14 3-20-14-11-26z"/>
      <path d="M184 84c5-9 19-8 23 2 9-5 21 4 15 14 7 7-2 17-11 13-8 8-20 1-18-9-12 1-16-13-9-20z"/>
    </g>
    <text class="status" x="10" y="17" fill="#e5e7eb" font-family="monospace" font-size="8" font-weight="700">SIP VIDEO  •  9999</text>
    <g class="enemy"><image href="data:image/png;base64," x="-17" y="-18" width="34" height="37" transform="translate(117 62) rotate(180)"/></g>
    <g class="player"><image href="data:image/png;base64," x="-15" y="-16.5" width="30" height="33"/></g>
    <image class="bullet" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAAXNSR0IArs4c6QAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9sLERcjDmsgqDQAAAAZdEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIEdJTVBXgQ4XAAAAN0lEQVQI1wXBMQ4AQAQEwL3Q64jKA/xW4a0SkdwMutvdI6KqXmYSkarODIvI3TGzqj4AAMxsdz94Sw6DDWXpjwAAAABJRU5ErkJggg==" width="5" height="5"/>
    <g class="blast">
      <circle cx="117" cy="62" r="14" fill="#ff3b00"/>
      <path d="m117 41 5 13 13-7-7 13 14 5-15 3 7 14-13-8-5 15-3-15-14 8 7-14-15-4 15-4-7-13 13 7z" fill="#ffb000"/>
      <circle cx="117" cy="62" r="6" fill="#fff36a"/>
    </g>
  </g>

  <g class="dial">
    <rect width="240" height="240" fill="#11151a"/>
    <rect x="14" y="14" width="212" height="212" rx="17" fill="#1b2027" stroke="#47515d" stroke-width="2"/>
    <circle cx="120" cy="25" r="3" fill="#555f6b"/>
    <text x="120" y="52" text-anchor="middle" fill="#98a5b3" font-size="9" font-weight="700">VIDEO CALL</text>
    <text x="89" y="80" text-anchor="middle" fill="#f4f7fa" font-family="monospace" font-size="24" font-weight="700" class="digit-1">9</text>
    <text x="110" y="80" text-anchor="middle" fill="#f4f7fa" font-family="monospace" font-size="24" font-weight="700" class="digit-2">9</text>
    <text x="131" y="80" text-anchor="middle" fill="#f4f7fa" font-family="monospace" font-size="24" font-weight="700" class="digit-3">9</text>
    <text x="152" y="80" text-anchor="middle" fill="#f4f7fa" font-family="monospace" font-size="24" font-weight="700" class="digit-4">9</text>
    <g fill="#313943" stroke="#4e5966" stroke-width="1">
      <circle cx="76" cy="109" r="17"/><circle cx="120" cy="109" r="17"/><circle cx="164" cy="109" r="17"/>
      <circle cx="76" cy="148" r="17"/><circle cx="120" cy="148" r="17"/><circle cx="164" cy="148" r="17"/>
      <circle cx="76" cy="187" r="17"/><circle cx="120" cy="187" r="17"/><circle cx="164" cy="187" r="17"/>
      <circle cx="120" cy="220" r="13" fill="#168f55" stroke="#2fc77c"/>
    </g>
    <g fill="#f4f7fa" font-size="15" font-weight="600" text-anchor="middle">
      <text x="76" y="114">1</text><text x="120" y="114">2</text><text x="164" y="114">3</text>
      <text x="76" y="153">4</text><text x="120" y="153">5</text><text x="164" y="153">6</text>
      <text x="76" y="192">7</text><text x="120" y="192">8</text><text x="164" y="192">9</text>
      <text x="120" y="224" font-size="12">☎</text>
    </g>
    <circle class="press-9-a" cx="164" cy="187" r="17" fill="#ffc928"/>
    <circle class="press-9-b" cx="164" cy="187" r="17" fill="#ffc928"/>
    <circle class="press-9-c" cx="164" cy="187" r="17" fill="#ffc928"/>
    <circle class="press-9-d" cx="164" cy="187" r="17" fill="#ffc928"/>
    <circle class="press-6" cx="164" cy="148" r="17" fill="#35bdf2"/>
    <circle class="press-2-a" cx="120" cy="109" r="17" fill="#35bdf2"/>
    <circle class="press-2-b" cx="120" cy="109" r="17" fill="#35bdf2"/>
    <circle class="press-5" cx="120" cy="148" r="17" fill="#ff7b42"/>
    <g fill="#11151a" font-size="15" font-weight="800" text-anchor="middle">
      <text class="press-9-a" x="164" y="192">9</text><text class="press-9-b" x="164" y="192">9</text>
      <text class="press-9-c" x="164" y="192">9</text><text class="press-9-d" x="164" y="192">9</text>
      <text class="press-6" x="164" y="153">6</text>
      <text class="press-2-a" x="120" y="114">2</text><text class="press-2-b" x="120" y="114">2</text>
      <text class="press-5" x="120" y="153">5</text>
    </g>
  </g>
</svg>
